name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep versions in sync with .mise.toml, .devcontainer/Dockerfile and rust-toolchain.toml.
env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "22.23.5"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  # Coverage floors: CI fails when coverage drops (frontend floors live in vite.config.ts).
  GO_COVERAGE_FLOOR: "78"

jobs:
  backend:
    name: Backend (Go) — lint, unit + integration tests, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l apps/api tools)" || (gofmt -l apps/api tools && exit 1)
      - name: golangci-lint (includes the semantic-names rule)
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./apps/api/... ./tools/icon-generator/...
      - name: Tests (race detector) + coverage floor
        run: ./scripts/check-go-coverage.sh "$GO_COVERAGE_FLOOR"

  frontend:
    name: Frontend (React/TS) — lint, unit + component tests, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests + coverage floor
        run: npm run test:coverage --workspace apps/desktop

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # WebKit matters: the desktop app runs on WebKitGTK on Linux.
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Browser
        working-directory: apps/desktop
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Playwright (fixture server + real backend + UI)
        working-directory: apps/desktop
        env:
          CI: "true"
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/desktop/playwright-report
          retention-days: 7

  desktop-check:
    name: Desktop shell (Rust) — fmt, clippy, tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # rustup picks the version from rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Sidecar and frontend bundle (required by tauri::generate_context!)
        run: |
          npm run build:sidecar --workspace apps/desktop
          npm run build --workspace apps/desktop
      - name: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
