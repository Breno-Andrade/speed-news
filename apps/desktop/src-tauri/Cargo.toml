[package]
name = "speed-news"
version = "0.1.0"
description = "Tray widget that aggregates Formula 1 news"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The suffix avoids a name clash with the binary on Windows.
name = "speed_news_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# Needed by tauri::generate_context! to embed the plugin configuration (updater).
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Linux tray backend: Tauri uses AppIndicator, which opens the menu on every click and never
# reports left clicks. Enabling `ksni` (StatusNotifierItem over D-Bus, pure Rust) takes precedence
# inside tray-icon: left click → popover, right click → menu.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# D-Bus service for the GNOME Shell panel button (same zbus build ksni already pulls in).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
