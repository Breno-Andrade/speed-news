name: Release

# Push a tag like v0.1.0 to build installers on real Linux, Windows and macOS machines
# and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "22.23.5"

jobs:
  bundle:
    name: Bundle (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Rust toolchain
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # tauri build runs beforeBuildCommand: builds the Go sidecar for this platform, then the UI.
      # The updater key signs every bundle; the action also uploads latest.json, which installed
      # apps read (through releases/latest) to update themselves once the draft is published.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Speed News ${{ github.ref_name }}
          releaseBody: |
            **Linux:** download the `.AppImage` (updates itself automatically). The `.deb`/`.rpm` work too, but each update asks for the administrator password.
            **Windows:** `.exe` installer. **macOS:** `.dmg` (not notarized yet: right-click → Open the first time).
            Already installed? The app updates itself in the background.
          releaseDraft: true
          prerelease: false
